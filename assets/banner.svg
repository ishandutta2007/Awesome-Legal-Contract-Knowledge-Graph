<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#121e36"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .node-pulse {
      animation: pulseNode 3s ease-in-out infinite;
      transform-origin: center;
    }
    .edge-flow {
      stroke-dasharray: 6 6;
      animation: dashMove 4s linear infinite;
    }
  </style>

  <!-- Background base -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Decorative ambient lighting circles -->
  <circle cx="150" cy="80" r="140" fill="url(#purple-glow)"/>
  <circle cx="1050" cy="280" r="180" fill="url(#cyan-glow)"/>
  <circle cx="950" cy="90" r="130" fill="url(#purple-glow)"/>

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#60a5fa" stroke-width="1">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" />
    <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" />
  </g>

  <!-- Knowledge Graph Illustration on Left/Right Background -->
  <!-- Left Side Graph Network -->
  <g opacity="0.6">
    <line x1="80" y1="120" x2="160" y2="70" stroke="#38bdf8" stroke-width="2" class="edge-flow"/>
    <line x1="80" y1="120" x2="140" y2="200" stroke="#818cf8" stroke-width="2"/>
    <line x1="160" y1="70" x2="230" y2="130" stroke="#a855f7" stroke-width="2"/>
    <line x1="140" y1="200" x2="230" y2="130" stroke="#38bdf8" stroke-width="2" class="edge-flow"/>
    <line x1="140" y1="200" x2="110" y2="290" stroke="#6366f1" stroke-width="2"/>
    <line x1="230" y1="130" x2="260" y2="240" stroke="#ec4899" stroke-width="2"/>

    <circle cx="80" cy="120" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="80" y="124" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="bold">PARTY</text>

    <circle cx="160" cy="70" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="3"/>
    <text x="160" y="74" fill="#818cf8" font-size="9" text-anchor="middle" font-weight="bold">CLAUSE</text>

    <circle cx="140" cy="200" r="18" fill="#1e293b" stroke="#a855f7" stroke-width="3" filter="url(#glow)"/>
    <text x="140" y="204" fill="#c084fc" font-size="9" text-anchor="middle" font-weight="bold">CONTRACT</text>

    <circle cx="230" cy="130" r="14" fill="#1e293b" stroke="#ec4899" stroke-width="3"/>
    <text x="230" y="134" fill="#f472b6" font-size="8" text-anchor="middle" font-weight="bold">LIABILITY</text>

    <circle cx="110" cy="290" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="260" cy="240" r="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Right Side Graph Network -->
  <g opacity="0.6">
    <line x1="1080" y1="100" x2="980" y2="160" stroke="#38bdf8" stroke-width="2" class="edge-flow"/>
    <line x1="980" y1="160" x2="1050" y2="250" stroke="#818cf8" stroke-width="2"/>
    <line x1="980" y1="160" x2="890" y2="100" stroke="#a855f7" stroke-width="2"/>
    <line x1="1050" y1="250" x2="940" y2="280" stroke="#38bdf8" stroke-width="2"/>
    <line x1="890" y1="100" x2="940" y2="280" stroke="#ec4899" stroke-width="2" class="edge-flow"/>

    <circle cx="1080" cy="100" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="1080" y="104" fill="#38bdf8" font-size="8" text-anchor="middle" font-weight="bold">ONTOLOGY</text>

    <circle cx="980" cy="160" r="18" fill="#1e293b" stroke="#818cf8" stroke-width="3" filter="url(#glow)"/>
    <text x="980" y="164" fill="#a78bfa" font-size="9" text-anchor="middle" font-weight="bold">ENTITY</text>

    <circle cx="1050" cy="250" r="14" fill="#1e293b" stroke="#c084fc" stroke-width="3"/>
    <text x="1050" y="254" fill="#c084fc" font-size="8" text-anchor="middle" font-weight="bold">TERM</text>

    <circle cx="890" cy="100" r="12" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <circle cx="940" cy="280" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="940" y="284" fill="#38bdf8" font-size="8" text-anchor="middle" font-weight="bold">OBLIGATION</text>
  </g>

  <!-- Central Header Text -->
  <g text-anchor="middle">
    <!-- Subtitle Pill -->
    <rect x="420" y="52" width="360" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="600" y="72" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="2">LEGAL CONTRACT KNOWLEDGE GRAPH</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#text-grad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Legal Contract</text>
    <text x="600" y="195" fill="url(#text-grad)" font-size="42" font-weight="800" letter-spacing="-0.5">Knowledge Graph</text>

    <!-- Tagline -->
    <text x="600" y="240" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing="0.5">
      Ontologies, Graph Databases, GraphRAG, Contract Intelligence &amp; Semantic Graphs
    </text>

    <!-- Feature Tags -->
    <g transform="translate(600, 290)">
      <!-- Tag 1 -->
      <rect x="-240" y="-12" width="105" height="25" rx="6" fill="#111827" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="-187" y="5" fill="#93c5fd" font-size="11" font-weight="500">🕸️ Graph Databases</text>

      <!-- Tag 2 -->
      <rect x="-120" y="-12" width="105" height="25" rx="6" fill="#111827" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <text x="-67" y="5" fill="#c4b5fd" font-size="11" font-weight="500">📜 Contract CLM</text>

      <!-- Tag 3 -->
      <rect x="0" y="-12" width="105" height="25" rx="6" fill="#111827" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
      <text x="53" y="5" fill="#f472b6" font-size="11" font-weight="500">🧠 GraphRAG &amp; AI</text>

      <!-- Tag 4 -->
      <rect x="120" y="-12" width="120" height="25" rx="6" fill="#111827" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="180" y="5" fill="#6ee7b7" font-size="11" font-weight="500">⚖️ Legal Ontologies</text>
    </g>
  </g>
</svg>